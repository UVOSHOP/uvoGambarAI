<!DOCTYPE html>
<html lang="id">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>UvoAI Gambar</title>
    <style>
        /* Body dasar */
        body {
            font-family: 'Roboto', sans-serif;
            margin: 0;
            padding: 0;
            background-color: #128C7E; /* Warna biru tua (seperti WhatsApp) */
        }

        /* Kontainer utama */
        #chat-container {
            width: 100%;
            max-width: 480px;
            height: 90vh;
            margin: 50px auto;
            background-color: white;
            border-radius: 20px;
            display: flex;
            flex-direction: column;
        }

        /* Kotak chat */
        #chat-box {
            flex-grow: 1;
            overflow-y: auto;
            padding: 10px;
            margin-bottom: 10px;
            display: flex;
            flex-direction: column;
        }

        /* Input box */
        #input-box {
            display: flex;
            padding: 10px;
            background-color: #ECE5DD;
            border-radius: 20px;
            align-items: center;
        }

        /* Input teks pengguna */
        #user-input {
            width: 85%;
            padding: 10px;
            border: 2px solid #ddd;
            border-radius: 20px;
            margin-right: 10px;
            font-size: 16px;
            outline: none;
        }

        /* Tombol kirim */
        #send-btn {
            padding: 10px 15px;
            background-color: #25D366;
            color: white;
            border: none;
            border-radius: 50%;
            cursor: pointer;
        }

        /* Bubbles chat */
        .chat-bubble {
            max-width: 75%;
            padding: 8px;
            border-radius: 10px;
            margin-bottom: 10px;
            word-wrap: break-word;
        }

        /* Bubble AI */
        .ai-bubble {
            background-color: #DCF8C6;
            align-self: flex-start;
        }

        /* Bubble pengguna */
        .user-bubble {
            background-color: #25D366;
            color: white;
            align-self: flex-end;
        }

        /* Kontainer gambar */
        #image-container {
            display: flex;
            flex-wrap: nowrap;
            overflow-x: auto;
            margin-top: 10px;
        }

        /* Gambar dalam kontainer */
        #image-container img {
            width: 100px;
            margin-right: 10px;
        }
    </style>
</head>
<body>
    <div id="chat-container">
        <div id="chat-box"></div>
        <div id="input-box">
            <input type="text" id="user-input" placeholder="Ketik perintah..." />
            <button id="send-btn" onclick="sendMessage()">Send</button>
        </div>
        <div id="image-container"></div>
    </div>

    <script>
        let messageCount = 0;
        const messageLimit = 10; // Set limit chat 10
        let chatBox = document.getElementById("chat-box");
        let userInput = document.getElementById("user-input");
        let sendBtn = document.getElementById("send-btn");
        let imageContainer = document.getElementById("image-container");
        let isProcessing = false;

        const imageDatabase = {
            "mobil": ["images/mobil1.jpg", "images/mobil2.jpg", "images/mobil3.jpg"],
            "pohon": ["images/pohon1.jpg", "images/pohon2.jpg", "images/pohon3.jpg"],
            "anjing": ["images/anjing1.jpg", "images/anjing2.jpg", "images/anjing3.jpg"],
            "kucing": ["images/kucing1.jpg", "images/kucing2.jpg", "images/kucing3.jpg"]
        };

        // Fungsi untuk kirim pesan
        userInput.addEventListener("input", () => {
            sendBtn.disabled = !userInput.value.trim() || isProcessing;
        });

        // Fungsi untuk kirim pesan saat menekan Enter
        userInput.addEventListener("keypress", function(event) {
            if (event.key === "Enter" && !isProcessing) {
                event.preventDefault();
                sendMessage();
            }
        });

        function sendMessage() {
            let userText = userInput.value.trim().toLowerCase();
            if (userText === "") return;

            if (messageCount >= messageLimit) {
                // Kirim formulir pembelian AI Pro ke WA jika limit tercapai
                window.location.href = "https://wa.me/6285648211278?text=Formulir%20pembelian%20AI%20Pro%20harga%20Rp%204999";
                return;
            }

            messageCount++;
            displayMessage(userText, 'user');

            userInput.value = "";
            sendBtn.disabled = true;
            userInput.disabled = true;
            isProcessing = true;

            setTimeout(() => {
                getAIResponse(userText);
            }, 1000);
        }

        function displayMessage(text, sender) {
            let bubble = document.createElement("div");
            bubble.classList.add("chat-bubble");
            bubble.classList.add(sender === 'user' ? "user-bubble" : "ai-bubble");
            bubble.textContent = text;
            chatBox.appendChild(bubble);
            chatBox.scrollTop = chatBox.scrollHeight;
        }

        // Fungsi untuk mendapatkan respons AI dengan pencarian gambar lokal
        function getAIResponse(userText) {
            let aiResponse = "Gambar yang cocok sedang diproses..."; // Example response
            displayMessage(aiResponse, 'ai');
            searchLocalImages(userText);  // Cari gambar dari folder lokal
        }

        // Fungsi untuk mencari gambar dari folder lokal
        function searchLocalImages(query) {
            if (imageDatabase[query]) {
                // Pilih gambar secara acak dari kumpulan gambar yang relevan
                let images = imageDatabase[query];
                images.forEach(img => {
                    let imgElement = document.createElement("img");
                    imgElement.src = img;  // Menampilkan gambar sesuai dengan nama file
                    imageContainer.appendChild(imgElement);
                });
            } else {
                let noImageFound = document.createElement("div");
                noImageFound.classList.add("chat-bubble");
                noImageFound.classList.add("ai-bubble");
                noImageFound.textContent = "Maaf, gambar tidak ditemukan.";
                chatBox.appendChild(noImageFound);
            }
            isProcessing = false;
            sendBtn.disabled = false;
            userInput.disabled = false;
            userInput.focus();
        }
    </script>
</body>
</html>
