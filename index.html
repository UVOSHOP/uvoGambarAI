<!DOCTYPE html>
<html lang="id">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>UvoAI Gambar</title>
    <style>
        body {
            font-family: Arial, sans-serif;
            background-color: #1e3a8a;
            color: white;
            margin: 0;
            padding: 0;
        }

        #chat-container {
            max-width: 400px;
            margin: 50px auto;
            background-color: #1e3a8a;
            padding: 10px;
            border-radius: 10px;
            box-shadow: 0 4px 6px rgba(0, 0, 0, 0.1);
        }

        #chat-box {
            overflow-y: auto;
            height: 300px;
            padding: 10px;
        }

        #input-box {
            display: flex;
            margin-top: 10px;
            align-items: center;
        }

        #user-input {
            width: 75%;
            padding: 10px;
            border-radius: 20px;
            border: none;
            margin-right: 10px;
        }

        #send-btn {
            padding: 10px;
            background-color: orange;
            color: white;
            border: none;
            border-radius: 20px;
            cursor: pointer;
        }

        #image-container {
            display: flex;
            flex-wrap: nowrap;
            overflow-x: auto;
            margin-top: 10px;
        }

        .chat-bubble {
            background-color: #4b8eeb;
            padding: 10px;
            border-radius: 10px;
            margin-bottom: 10px;
            max-width: 70%;
            word-wrap: break-word;
        }

        .ai-bubble {
            background-color: #3751d1;
            align-self: flex-start;
        }

        .user-bubble {
            background-color: #4CAF50;
            align-self: flex-end;
        }
    </style>
</head>
<body>
    <div id="chat-container">
        <div id="chat-box"></div>
        <div id="input-box">
            <input type="text" id="user-input" placeholder="Ketik perintah..." disabled>
            <button id="send-btn" onclick="sendMessage()" disabled>Send</button>
        </div>
        <div id="image-container"></div>
    </div>
    <script>
        let messageCount = 0;
        let chatBox = document.getElementById("chat-box");
        let userInput = document.getElementById("user-input");
        let sendBtn = document.getElementById("send-btn");
        let imageContainer = document.getElementById("image-container");

        function sendMessage() {
            let userText = userInput.value.trim();
            if (userText === "") return;

            messageCount++;
            displayMessage(userText, 'user');

            userInput.value = "";
            sendBtn.disabled = true;
            userInput.disabled = true;

            setTimeout(() => {
                getAIResponse(userText);
            }, 1000);
        }

        function displayMessage(text, sender) {
            let bubble = document.createElement("div");
            bubble.classList.add("chat-bubble");
            bubble.classList.add(sender === 'user' ? "user-bubble" : "ai-bubble");
            bubble.textContent = text;
            chatBox.appendChild(bubble);
            chatBox.scrollTop = chatBox.scrollHeight;
        }

        function getAIResponse(userText) {
            let aiResponse = "Gambar yang cocok sedang diproses..."; // Example response

            // Here you would connect to your AI service to get an image URL based on userText
            // This is a dummy image URL for the sake of this example
            let imageUrl = "https://via.placeholder.com/100";

            displayMessage(aiResponse, 'ai');
            displayImage(imageUrl);

            // Enable input for next prompt if not at limit
            if (messageCount < 50) {
                userInput.disabled = false;
                sendBtn.disabled = false;
            } else {
                sendFormToWA();
            }
        }

        function displayImage(imageUrl) {
            let imgElement = document.createElement("img");
            imgElement.src = imageUrl;
            imgElement.style.width = "100px";
            imgElement.style.marginRight = "10px";
            imageContainer.appendChild(imgElement);
        }

        function sendFormToWA() {
            let waURL = "https://wa.me/6285648211278?text=Formulir%20Pembelian%20AI%20Pro%20Rp%204999";
            window.location.href = waURL; // Redirect to WhatsApp with form
        }
    </script>
</body>
</html>
