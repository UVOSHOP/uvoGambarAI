<!DOCTYPE html>
<html lang="id">
<head>
  <meta charset="UTF-8" />
  <title>UvoAI Gambar</title>
  <style>
    body {
      margin: 0;
      font-family: 'Segoe UI', sans-serif;
      background-color: #001f3f;
      display: flex;
      justify-content: center;
      align-items: center;
      height: 100vh;
    }

    .chat-container {
      background: #fff;
      border-radius: 10px;
      width: 100%;
      max-width: 400px;
      height: 90vh;
      display: flex;
      flex-direction: column;
      box-shadow: 0 0 10px #000;
      overflow: hidden;
    }

    .chat-header {
      padding: 15px;
      background-color: #075e54;
      color: white;
      font-weight: bold;
    }

    .chat-box {
      flex: 1;
      padding: 10px;
      overflow-y: auto;
      background: #e5ddd5;
      display: flex;
      flex-direction: column;
    }

    .chat-bubble {
      padding: 10px;
      margin: 5px;
      border-radius: 10px;
      max-width: 80%;
      word-wrap: break-word;
    }

    .chat-bubble.user {
      background-color: #dcf8c6;
      align-self: flex-end;
    }

    .chat-bubble.bot {
      background-color: #fff;
      align-self: flex-start;
    }

    .chat-input {
      display: flex;
      padding: 10px;
      background-color: #f0f0f0;
    }

    .chat-input input {
      flex: 1;
      padding: 10px;
      border-radius: 20px;
      border: none;
    }

    .chat-input button {
      margin-left: 10px;
      background-color: orange;
      color: white;
      border: none;
      border-radius: 20px;
      padding: 10px 20px;
      cursor: pointer;
    }
  </style>
</head>
<body>
  <div class="chat-container">
    <div class="chat-header">UvoAI - AI Gambar</div>
    <div class="chat-box" id="chatBox"></div>
    <div class="chat-input">
      <input type="text" id="userInput" placeholder="Tulis deskripsi gambar..." />
      <button id="sendButton">Kirim</button>
    </div>
  </div>

  <script>
    let isProcessing = false;

    document.getElementById("sendButton").addEventListener("click", sendPrompt);
    document.getElementById("userInput").addEventListener("keydown", function(e) {
      if (e.key === "Enter") sendPrompt();
    });

    function sendPrompt() {
      if (isProcessing) return;
      const input = document.getElementById("userInput");
      const chatBox = document.getElementById("chatBox");
      const prompt = input.value.trim();
      if (!prompt) return;

      isProcessing = true;

      const userBubble = document.createElement("div");
      userBubble.className = "chat-bubble user";
      userBubble.textContent = prompt;
      chatBox.appendChild(userBubble);
      chatBox.scrollTop = chatBox.scrollHeight;

      const botBubble = document.createElement("div");
      botBubble.className = "chat-bubble bot";
      botBubble.textContent = "Sedang memproses gambar...";
      chatBox.appendChild(botBubble);
      chatBox.scrollTop = chatBox.scrollHeight;

      fetch(`http://localhost:5000/generate?prompt=${encodeURIComponent(prompt)}`)
        .then(res => {
          if (!res.ok) throw new Error("Gagal merespons");
          return res.blob();
        })
        .then(blob => {
          botBubble.textContent = "";
          const img = document.createElement("img");
          img.src = URL.createObjectURL(blob);
          img.style.maxWidth = "100%";
          img.style.borderRadius = "10px";
          botBubble.appendChild(img);
          chatBox.scrollTop = chatBox.scrollHeight;
        })
        .catch(err => {
          botBubble.textContent = "Gagal memproses gambar. Pastikan Python berjalan.";
          console.error(err);
        })
        .finally(() => {
          isProcessing = false;
        });

      input.value = "";
    }
  </script>
</body>
</html>
