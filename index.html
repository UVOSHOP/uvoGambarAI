<!DOCTYPE html>
<html lang="id">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>UvoAI Gambar</title>

    <!-- Google AdSense Script -->
    <script async src="https://pagead2.googlesyndication.com/pagead/js/adsbygoogle.js?client=ca-pub-3303675784689911"
        crossorigin="anonymous"></script>

    <style>
        body {
            font-family: 'Roboto', sans-serif;
            margin: 0;
            padding: 0;
            background-color: #ababab;
        }
        #chat-container {
            width: 100%;
            max-width: 480px;
            height: 90vh;
            margin: 50px auto;
            background-color: white;
            border-radius: 20px;
            display: flex;
            flex-direction: column;
        }
        #chat-box {
            flex-grow: 1;
            overflow-y: auto;
            padding: 10px;
            margin-bottom: 10px;
            display: flex;
            flex-direction: column;
        }
        #input-box {
            display: flex;
            padding: 10px;
            background-color: #ECE5DD;
            border-radius: 20px;
            align-items: center;
        }
        #user-input {
            width: 85%;
            padding: 10px;
            border: 2px solid #ddd;
            border-radius: 20px;
            margin-right: 10px;
            font-size: 16px;
            outline: none;
        }
        #send-btn {
            padding: 10px 15px;
            background-color: #25D366;
            color: white;
            border: none;
            border-radius: 50%;
            cursor: pointer;
        }
        .chat-bubble {
            max-width: 75%;
            padding: 8px;
            border-radius: 10px;
            margin-bottom: 10px;
            word-wrap: break-word;
        }
        .ai-bubble {
            background-color: #DCF8C6;
            align-self: flex-start;
        }
        .user-bubble {
            background-color: #25D366;
            color: white;
            align-self: flex-end;
        }
        .image-result {
            max-width: 100%;
            border-radius: 10px;
            margin-top: 10px;
            align-self: center;
        }
    </style>
</head>
<body>
    <div id="chat-container">
        <div id="chat-box"></div>
        <div id="input-box">
            <input type="text" id="user-input" placeholder="Ketik perintah..." />
            <button id="send-btn" onclick="sendMessage()">Send</button>
        </div>
    </div>

    <script>
        let messageCount = 0;
        const messageLimit = 10; // Set limit chat 10
        let chatBox = document.getElementById("chat-box");
        let userInput = document.getElementById("user-input");
        let sendBtn = document.getElementById("send-btn");

        userInput.addEventListener("input", () => {
            sendBtn.disabled = !userInput.value.trim();
        });

        userInput.addEventListener("keypress", function(event) {
            if (event.key === "Enter") {
                event.preventDefault();
                sendMessage();
            }
        });

        function sendMessage() {
            let userText = userInput.value.trim().toLowerCase();
            if (userText === "") return;

            if (messageCount >= messageLimit) {
                window.location.href = "https://wa.me/6285648211278?text=Formulir%20pembelian%20AI%20Pro%20harga%20Rp%204999";
                return;
            }

            messageCount++;
            displayMessage(userText, 'user');

            userInput.value = "";
            sendBtn.disabled = true;
            userInput.disabled = true;

            setTimeout(() => {
                getAIResponse(userText);
            }, 1000);
        }

        function displayMessage(text, sender) {
            let bubble = document.createElement("div");
            bubble.classList.add("chat-bubble");
            bubble.classList.add(sender === 'user' ? "user-bubble" : "ai-bubble");
            bubble.textContent = text;
            chatBox.appendChild(bubble);
            chatBox.scrollTop = chatBox.scrollHeight;
        }

        function getAIResponse(userText) {
            let aiResponse = "Mencari gambar terkait...";
            displayMessage(aiResponse, 'ai');

            // Menampilkan gambar pertama dari pencarian
            displayImage('https://www.pinterest.com/pin/492261747460881953/'); // Link gambar dari Pinterest atau sumber lain
        }

        function displayImage(url) {
            let image = document.createElement("img");
            image.src = url; // Gambar URL
            image.alt = "Gambar hasil pencarian";
            image.classList.add("image-result");

            chatBox.appendChild(image);
            chatBox.scrollTop = chatBox.scrollHeight;
        }
    </script>
</body>
</html>
