<!DOCTYPE html>
<html lang="id">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>UvoAI Gambar</title>
    <style>
        body {
            font-family: 'Roboto', sans-serif;
            margin: 0;
            padding: 0;
            background-color: #128C7E;
        }

        #chat-container {
            width: 100%;
            max-width: 480px;
            height: 90vh;
            margin: 50px auto;
            background-color: white;
            border-radius: 20px;
            display: flex;
            flex-direction: column;
        }

        #chat-box {
            flex-grow: 1;
            overflow-y: auto;
            padding: 10px;
            margin-bottom: 10px;
            display: flex;
            flex-direction: column;
        }

        #input-box {
            display: flex;
            padding: 10px;
            background-color: #ECE5DD;
            border-radius: 20px;
            align-items: center;
        }

        #user-input {
            width: 85%;
            padding: 10px;
            border: 2px solid #ddd;
            border-radius: 20px;
            margin-right: 10px;
            font-size: 16px;
            outline: none;
        }

        #send-btn {
            padding: 10px 15px;
            background-color: #25D366;
            color: white;
            border: none;
            border-radius: 50%;
            cursor: pointer;
        }

        .chat-bubble {
            max-width: 75%;
            padding: 8px;
            border-radius: 10px;
            margin-bottom: 10px;
            word-wrap: break-word;
        }

        .ai-bubble {
            background-color: #DCF8C6;
            align-self: flex-start;
        }

        .user-bubble {
            background-color: #25D366;
            color: white;
            align-self: flex-end;
        }

        #image-container {
            display: flex;
            flex-wrap: nowrap;
            overflow-x: auto;
            margin-top: 10px;
        }

        #image-container img {
            width: 100px;
            margin-right: 10px;
        }
    </style>
</head>
<body>
    <div id="chat-container">
        <div id="chat-box"></div>
        <div id="input-box">
            <input type="text" id="user-input" placeholder="Ketik perintah..." />
            <button id="send-btn" onclick="sendMessage()">Send</button>
        </div>
        <div id="image-container"></div>
    </div>
    <script>
        let messageCount = 0;
        let chatBox = document.getElementById("chat-box");
        let userInput = document.getElementById("user-input");
        let sendBtn = document.getElementById("send-btn");
        let imageContainer = document.getElementById("image-container");

        // Aktifkan tombol kirim jika input ada
        userInput.addEventListener("input", () => {
            sendBtn.disabled = !userInput.value.trim();
        });

        // Kirim pesan pengguna
        function sendMessage() {
            let userText = userInput.value.trim();
            if (userText === "") return;

            messageCount++;
            displayMessage(userText, 'user');

            userInput.value = "";
            sendBtn.disabled = true;

            setTimeout(() => {
                getAIResponse(userText);
            }, 1000);
        }

        // Menampilkan pesan pada chat
        function displayMessage(text, sender) {
            let bubble = document.createElement("div");
            bubble.classList.add("chat-bubble");
            bubble.classList.add(sender === 'user' ? "user-bubble" : "ai-bubble");
            bubble.textContent = text;
            chatBox.appendChild(bubble);
            chatBox.scrollTop = chatBox.scrollHeight;
        }

        // Mendapatkan respons AI (dummy response dan gambar)
        function getAIResponse(userText) {
            let aiResponse = "Gambar yang cocok sedang diproses..."; // Example response

            // Gambar contoh (dummy)
            let imageUrl = "https://via.placeholder.com/100";

            displayMessage(aiResponse, 'ai');
            displayImage(imageUrl);

            // Enable input and send button for next prompt if not at limit
            if (messageCount < 50) {
                userInput.disabled = false;
            } else {
                sendFormToWA();
            }
        }

        // Menampilkan gambar AI
        function displayImage(imageUrl) {
            let imgElement = document.createElement("img");
            imgElement.src = imageUrl;
            imageContainer.appendChild(imgElement);
        }

        // Kirim formulir pembelian AI Pro jika mencapai batas
        function sendFormToWA() {
            let waURL = "https://wa.me/6285648211278?text=Formulir%20Pembelian%20AI%20Pro%20Rp%204999";
            window.location.href = waURL; // Redirect to WhatsApp with form
        }
    </script>
</body>
</html>
